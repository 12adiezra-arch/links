<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צ'ק-ליסט התחליפים | עדי עזרא</title>

<meta property="og:title" content="צ'ק-ליסט התחליפים | עדי עזרא">
<meta property="og:description" content="איך לא להרוס אף מתכון מתוק בבית.">

<meta name="theme-color" content="#26150F">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cocoa: #26150F;
    --cream: #FFF6EC;
    --cream-2: #FFE9CF;
    --mango: #FF9A1F;
    --mango-2: #FFC94A;
    --ink-soft: #6B5347;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    background: var(--cream);
    color: var(--cocoa);
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px 16px;
    line-height: 1.5;
  }
  .box {
    width: 100%; max-width: 420px;
    background: #fff;
    border-radius: 26px; overflow: hidden;
    box-shadow: 0 14px 30px rgba(38, 21, 15, .16);
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .cover { background: var(--cream-2); padding: 22px 22px 0; text-align: center; }
  .cover img {
    width: 62%; max-width: 230px; height: auto; display: block; margin: 0 auto;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -2px 18px rgba(38, 21, 15, .18);
  }
  .body { padding: 22px 22px 24px; }
  h1 { font-weight: 900; font-size: 28px; line-height: 1.15; }
  .lead { font-size: 17px; margin-top: 8px; color: var(--ink-soft); }
  ul { list-style: none; margin-top: 14px; display: grid; gap: 6px; }
  li { font-size: 16px; padding-right: 26px; position: relative; }
  li::before { content: "✓"; position: absolute; right: 0; top: 0; color: var(--mango); font-weight: 900; }
  .note { font-size: 13px; color: var(--ink-soft); margin-top: 12px; text-align: center; }

  /* Rav Messer form, restyled to match the page */
  .rm-form { margin-top: 18px; }
  .rm-form, .rm-form * { font-family: "Rubik", system-ui, sans-serif !important; }
  .rm-form [role="heading"] { display: none !important; }
  .rm-form [class*="uniqueid_"] { background: transparent !important; padding-left: 0 !important; padding-right: 0 !important; }
  .rm-form input[type="text"], .rm-form input[type="email"] {
    height: 54px !important;
    padding: 0 16px !important;
    border: 2px solid var(--cream-2) !important;
    border-radius: 14px !important;
    background: #fff !important;
    color: var(--cocoa) !important;
    font-size: 17px !important; /* 16px+ keeps iPhone from zooming in on focus */
    box-shadow: none !important;
  }
  .rm-form input::placeholder { color: #A08C80 !important; }
  .rm-form input[type="text"]:focus, .rm-form input[type="email"]:focus { border-color: var(--mango) !important; outline: none !important; }
  .rm-form .submitButton {
    display: flex !important; align-items: center !important; justify-content: center !important;
    width: 100% !important;
    height: 54px !important;
    text-decoration: none !important;
    border: 0 !important;
    border-radius: 999px !important;
    background: var(--mango) !important;
    color: var(--cocoa) !important;
    font-size: 18px !important; font-weight: 700 !important;
    box-shadow: 0 4px 0 #C46A00 !important;
    cursor: pointer;
  }
  .rm-form .submitButton * { color: var(--cocoa) !important; font-weight: 700 !important; }
  .rm-form .submitButton:active { transform: scale(.97); box-shadow: 0 1px 0 #C46A00 !important; }
  @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
</style>
</head>
<body>
  <main class="box">
    <div class="cover">
      <img src="cover.webp" width="720" height="1018" alt="כריכת הצ'ק-ליסט: צ'ק-ליסט התחליפים, איך לא להרוס אף מתכון מתוק בבית">
    </div>
    <div class="body">
      <h1>חסר לך מצרך באמצע מתכון?</h1>
      <p class="lead">לפני שאת מוותרת על המתכון 😂 הצ'ק-ליסט שלי מראה לך במה להחליף.</p>
      <ul>
        <li>איך לא להרוס אף מתכון מתוק בבית</li>
        <li>מה עושים כשחסר מצרך</li>
        <li>נשמר לך בטלפון, תמיד בהישג יד</li>
      </ul>
      <div class="rm-form">
        <script type="text/javascript" src="https://form2.ravpage.co.il/f9e4af50992f235b01a02e5e17a857116ADDE54A" charset="UTF-8"></script>
      </div>
      <p class="note">הצ'ק-ליסט נפתח מיד, ונשלח גם למייל שלך.</p>
    </div>
  </main>
</body>
</html>
