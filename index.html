<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עדי עזרא</title>
<meta name="description" content="טעים כמו שרציתי, פשוט כמו שאני צריכה.">
<meta property="og:title" content="עדי עזרא">
<meta property="og:description" content="טעים כמו שרציתי, פשוט כמו שאני צריכה.">
<meta property="og:image" content="img/fruit.webp">
<meta name="theme-color" content="#26150F">
<link rel="icon" href="img/adi.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cocoa: #26150F;
    --cocoa-2: #3A2219;
    --cream: #FFF6EC;
    --cream-2: #FFE9CF;
    --mango: #FF9A1F;
    --mango-2: #FFC94A;
    --berry: #8F2A42;
    --ink-soft: #6B5347;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    background: var(--cream);
    color: var(--cocoa);
    min-height: 100vh;
    line-height: 1.5;
  }
  a { color: inherit; }

  .top {
    background: var(--cocoa);
    height: 92px;
    border-radius: 0 0 50% 50% / 0 0 28px 28px;
  }
  .wrap {
    max-width: 460px;
    margin: -60px auto 0;
    padding: 0 16px 32px;
  }

  /* Profile */
  .me { text-align: center; }
  .me img {
    width: 92px; height: 92px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--cream);
    box-shadow: 0 0 0 3px var(--mango), 0 8px 18px rgba(38, 21, 15, .22);
    display: block;
    margin: 0 auto;
  }
  .me h1 {
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -.3px;
    margin-top: 8px;
    line-height: 1.1;
  }
  .me p {
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* Cards */
  .cards { display: grid; gap: 12px; margin-top: 16px; }
  .card {
    border-radius: 22px;
    overflow: hidden;
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  .card:nth-child(2) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%;
    min-height: 46px;
    padding: 10px 18px;
    border-radius: 999px;
    font: 700 16px/1.2 "Rubik", sans-serif;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* Fruit (coming soon) */
  .fruit { background: var(--cocoa); color: var(--cream); box-shadow: 0 10px 24px rgba(38, 21, 15, .25); }
  .fruit .pic { position: relative; aspect-ratio: 16 / 8; }
  .fruit .pic > img:not(.logo) { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block; }
  .fruit .pic .logo {
    position: absolute; z-index: 1; right: 14px; bottom: 4px;
    width: 32%; max-width: 140px; height: auto;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, .45));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fruit .pic::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 70%;
    background: linear-gradient(to top, var(--cocoa), transparent);
  }
  .badge {
    position: absolute; top: 10px; right: 10px; z-index: 1;
    background: var(--mango-2); color: var(--cocoa);
    font-weight: 900; font-size: 13px;
    padding: 5px 11px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
    display: flex; align-items: center; gap: 6px;
  }
  .badge i {
    width: 8px; height: 8px; border-radius: 50%; background: var(--berry);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }
  .fruit .body { padding: 0 16px 14px; position: relative; margin-top: -6px; }
  .fruit h2 {
    font-weight: 900; font-size: 24px; line-height: 1.1;
    color: var(--mango-2);
  }
  .fruit .lead { font-size: 15px; font-weight: 500; margin-top: 2px; }
  .fruit .btn {
    margin-top: 12px;
    background: var(--mango); color: var(--cocoa);
    box-shadow: 0 4px 0 #C46A00;
  }
  .fruit .btn:active { box-shadow: 0 1px 0 #C46A00; }
  .fruit .note { font-size: 13px; text-align: center; margin-top: 9px; opacity: .85; }

  /* Kit */
  .kit {
    background: #fff;
    display: grid; grid-template-columns: 66px 1fr; gap: 6px 12px;
    align-items: center;
    padding: 12px;
    box-shadow: 0 6px 18px rgba(38, 21, 15, .09);
    border: 2px solid var(--cream-2);
  }
  .kit img {
    grid-row: span 2;
    width: 66px; aspect-ratio: 480 / 680; object-fit: cover;
    border-radius: 10px; display: block;
  }
  .kit h2 { font-weight: 900; font-size: 18px; line-height: 1.15; }
  .kit p { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .kit .btn {
    background: var(--berry); color: #fff;
    box-shadow: 0 4px 0 #5E1A2B;
    min-height: 42px;
  }
  .kit .btn:active { box-shadow: 0 1px 0 #5E1A2B; }

  /* Short phones (iPhone SE, small Androids inside Instagram): keep both buttons on the first screen */
  @media (max-height: 640px) {
    .top { height: 70px; }
    .wrap { margin-top: -48px; }
    .me img { width: 68px; height: 68px; border-width: 3px; }
    .me h1 { font-size: 21px; margin-top: 6px; }
    .me p { font-size: 14px; }
    .cards { margin-top: 12px; gap: 10px; }
    .fruit .pic { aspect-ratio: 16 / 6; }
    .badge { right: auto; left: 10px; }
    .fruit .pic .logo { width: 28%; }
    .fruit h2 { font-size: 21px; }
    .fruit .btn { margin-top: 10px; }
    .fruit .note { margin-top: 7px; font-size: 12px; }
    .kit { padding: 10px; }
    .kit img { width: 52px; }
    .kit { grid-template-columns: 52px 1fr; }
  }

  /* Footer */
  footer { text-align: center; margin-top: 26px; }
  .social { display: flex; justify-content: center; gap: 14px; }
  .social a {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--cocoa); color: var(--cream);
    display: grid; place-items: center;
  }
  .social svg { width: 22px; height: 22px; }
  footer small { display: block; margin-top: 14px; color: var(--ink-soft); font-size: 13px; }

  @media (hover: hover) {
    .btn:hover { transform: translateY(-2px); }
    .social a:hover { background: var(--berry); }
  }
  /* Waitlist sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(38, 21, 15, .55);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  .sheet.open { opacity: 1; visibility: visible; }
  /* Rav Messer's form CSS sets visibility on its own elements, which would leave invisible
     but tappable bits over the page while the sheet is closed. */
  .sheet:not(.open), .sheet:not(.open) * { visibility: hidden !important; pointer-events: none !important; }
  .sheet-panel {
    position: relative;
    width: 100%; max-width: 460px;
    max-height: 92vh; overflow-y: auto;
    background: var(--cream);
    border-radius: 26px 26px 0 0;
    padding: 26px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(40px);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .sheet.open .sheet-panel { transform: none; }
  .sheet-panel h2 { font-weight: 900; font-size: 24px; line-height: 1.15; padding-left: 40px; }
  .sheet-panel > p { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
  .sheet-close {
    position: absolute; top: 16px; left: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: var(--cream-2); color: var(--cocoa);
    display: grid; place-items: center; cursor: pointer;
  }
  .sheet-close svg { width: 20px; height: 20px; }
  @media (min-width: 600px) {
    .sheet { align-items: center; }
    .sheet-panel { border-radius: 26px; }
  }

  /* Rav Messer form, restyled to match the page */
  .rm-form { margin-top: 14px; }
  .rm-form, .rm-form * { font-family: "Rubik", system-ui, sans-serif !important; }
  #waitlist .rm-form [role="heading"] { display: none !important; }
  #waitlist .rm-form [class*="uniqueid_"] { background: transparent !important; }
  #waitlist .rm-form input[type="text"] {
    height: 54px !important;
    padding: 0 16px !important;
    border: 2px solid var(--cream-2) !important;
    border-radius: 14px !important;
    background: #fff !important;
    color: var(--cocoa) !important;
    font-size: 17px !important; /* 16px+ keeps iPhone from zooming in on focus */
    box-shadow: none !important;
  }
  #waitlist .rm-form input[type="text"]::placeholder { color: #A08C80 !important; }
  #waitlist .rm-form input[type="text"]:focus { border-color: var(--mango) !important; outline: none !important; }
  #waitlist .rm-form .submitButton {
    display: flex !important; align-items: center !important; justify-content: center !important;
    width: 100% !important;
    height: 54px !important;
    text-decoration: none !important;
    border: 0 !important;
    border-radius: 999px !important;
    background: var(--mango) !important;
    color: var(--cocoa) !important;
    font-size: 18px !important; font-weight: 700 !important;
    box-shadow: 0 4px 0 #C46A00 !important;
    cursor: pointer;
  }
  #waitlist .rm-form .submitButton * { color: var(--cocoa) !important; font-weight: 700 !important; }
  #waitlist .rm-form .submitButton:active { transform: scale(.97); box-shadow: 0 1px 0 #C46A00 !important; }

  a:focus-visible { outline: 3px solid var(--mango); outline-offset: 3px; }
  /* Fairy dust: full-page canvas drawn by the script at the end of the page; never blocks taps */
  .fairy { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

          ctx.globalAlpha = Math.max(0, a2); ctx.drawImage((o.st ? STARS : DOTS)[o.c], o.x - s2 / 2, o.y - s2 / 2, s2, s2);
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
